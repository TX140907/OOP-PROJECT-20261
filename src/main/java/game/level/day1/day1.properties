# ============================================================================
# 21. VẬT PHẨM HỒI MÁU
# ============================================================================
healthPickup.enabled=false                                   # true = thỉnh thoảng sinh vật phẩm hồi máu riêng, không dùng trọng số vật cản.

# ============================================================================
# 22. CAO TRÀO — ĐOÀN XE CUỐI MÀN
# ============================================================================
event.type=convoy                                            # convoy = đoàn xe chừa lối trống đổi từng làn kề nhau; none = tắt cao trào.
event.startSeconds=24                                        # Mốc tiến độ hiệu dụng bắt đầu cảnh báo đoàn xe (giây); sau cuối màn thì sự kiện không chạy.
event.warningSeconds=1.2                                     # Thời gian báo trước trên màn hình trước khi chờ đường thông và bắt đầu cao trào (giây).
event.clearTimeoutSeconds=7                                  # Chờ vật cản cũ đi hết tối đa (giây); đầu sự kiện còn chật thì bỏ sự kiện, cuối sự kiện hết chờ thì trả quyền sinh thường.
event.maxDurationSeconds=10                                  # Thời gian tối đa thử sinh các đợt cao trào (giây), không tính cảnh báo/chờ đường; hết giờ bỏ các đợt chưa đặt được.
event.retrySeconds=0.35                                      # Khoảng chờ thử lại nếu cả đợt chưa đặt được an toàn (giây); không ép sinh hoặc xóa vật cản cũ.
event.convoy.waveCount=3                                     # Số đợt xe tối đa; mỗi đợt hai xe và chừa một làn, không bắt buộc đủ đợt nếu thiếu chỗ.
event.convoy.intervalSeconds=2.6                             # Khoảng nghỉ tối thiểu giữa hai đợt được sinh thành công (giây); chưa an toàn thì chờ thêm.
event.convoy.speedMultiplier=1.05                             # Hệ số tốc độ đoàn xe so với tốc độ ngẫu nhiên trong vehicle.minSpeed/maxSpeed; cả đoàn dùng chung tốc độ.
event.convoy.staggerY=60                                     # Độ lệch dọc giữa hai xe cùng đợt (px), tránh cùng tọa độ Y; lối trống đầu tiên gần vị trí người chơi.

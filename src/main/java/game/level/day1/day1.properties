# Chọn loại có sẵn: vehicle (xe), shark (cá mập). Phân cách bằng dấu phẩy.
obstacles=vehicle,shark
# Xác suất độc lập mỗi đợt (%): xe luôn xuất hiện, cá mập tắt.
vehicle.chance=100
shark.chance=0
# Tốc độ xe, px/giây.
vehicle.speed=312.5
# Ngưỡng Y sinh đợt mới và khoảng lệch Y cùng đợt (px).
spawn.thresholdY=200
spawn.yGap=60
# Số giây giữa hai đợt; giảm để sinh nhanh hơn, đặt 0 để chờ theo ngưỡng Y.
spawn.intervalSeconds=1.3
# Đường dẫn ảnh riêng trong resources.
background=/image/day1/background.png
road=/image/day1/road.png

# Chọn loại có sẵn: vehicle (xe), shark (cá mập). Phân cách bằng dấu phẩy.
obstacles=vehicle,shark
# Xác suất độc lập mỗi đợt (%): có thể ra cả hai, một loại hoặc không loại nào.
vehicle.chance=100
shark.chance=45
# Tốc độ xe khi bật xe, px/giây.
vehicle.speed=325
# Ngưỡng Y sinh đợt mới và khoảng lệch Y cùng đợt (px).
spawn.thresholdY=170
spawn.yGap=60
# Mỗi 1,75 giây xét sinh một đợt; tối đa 5 vật cản cùng tồn tại.
spawn.intervalSeconds=1.25
spawn.maxActive=6
# Đường dẫn ảnh riêng trong resources.
background=/image/day2/background.png
road=/image/day2/road.png

# NGÀY 2 - ĐƯỜNG NGẬP
# Ghi chú bắt đầu bằng dấu # có khoảng trắng hai bên; chỉ sửa phần giá trị ở phía trước.
# Đơn vị: px = điểm ảnh; giây; px/giây; hệ số 1 = 100%, 0.65 = 65%.
# Lưu UTF-8; sau khi sửa, chạy run.cmd để build lại.
# Nhóm hiệu ứng chỉ tác dụng khi vật cản/hệ tương ứng được bật trong màn này.

# ============================================================================
# 01. THÔNG TIN MÀN CHƠI
# ============================================================================
level.id=2                                                   # Mã màn: 1, 2, 3, 4, 51 (đường bộ ngày 5) hoặc 52 (trực thăng).
level.name=Ngày 2 - Đường ngập                               # Tên màn hiển thị trên thanh thông tin trong game.
level.mode=road                                              # road = đường bộ; air = bầu trời, dùng nhân vật trực thăng.
level.durationSeconds=40                                     # Thời gian tiến hiệu dụng để hoàn thành màn (giây); chậm làm lâu hơn, tăng tốc làm nhanh hơn.
level.initialHealth=3                                        # Số máu ban đầu khi bắt đầu hoặc chơi lại màn.
player.maxHealth=3                                           # Số máu tối đa; vật phẩm hồi máu không tăng quá mức này.
level.scrollSpeed=130                                        # Tốc độ cuộn cảnh cơ bản (px/giây); vật đứng yên trong thế giới trôi theo tốc độ này.

# ============================================================================
# 02. MÀU SẮC VÀ VẠCH ĐƯỜNG
# ============================================================================
level.backgroundColor=#204f66                                # Màu nền hai bên hoặc bầu trời, theo mã màu #RRGGBB.
level.roadColor=#316d8b                                      # Màu mặt đường khi chưa có ảnh đường, theo mã màu #RRGGBB.
road.overlayLines=false                                      # true = vẽ thêm vạch lên ảnh đường; false = không đè vạch lên ảnh thật; thiếu ảnh vẫn vẽ vạch tạm.

# ============================================================================
# 03. NHÂN VẬT — KÍCH THƯỚC VÀ DI CHUYỂN
# ============================================================================
player.width=100                                             # Chiều rộng hình nhân vật (px); ảnh và giới hạn mép phải dùng kích thước này.
player.height=100                                            # Chiều cao hình nhân vật (px).
player.y=520                                                 # Tọa độ mép trên nhân vật (px), tăng từ trên xuống; nhân vật không tự đổi Y.
player.minX=140                                              # Tọa độ mép trái nhỏ nhất của nhân vật (px).
player.maxX=760                                              # Tọa độ mép trái lớn nhất của nhân vật (px); mép phải thực tế = maxX + width.
player.maxSpeed=420                                          # Tốc độ ngang tối đa khi không có hiệu ứng (px/giây).
player.acceleration=1500                                     # Gia tốc ngang khi giữ phím di chuyển (px/giây²).
player.deceleration=2000                                     # Độ giảm tốc khi thả phím hoặc hãm để đổi hướng (px/giây²).

# ============================================================================
# 04. NHÂN VẬT — VÙNG VA CHẠM
# ============================================================================
player.hitboxWidth=88                                        # Chiều rộng vùng va chạm của nhân vật (px), có thể nhỏ hơn ảnh.
player.hitboxHeight=86                                       # Chiều cao vùng va chạm của nhân vật (px).
player.hitboxOffsetX=6                                       # Độ lệch ngang vùng va chạm so với mép trái ảnh (px).
player.hitboxOffsetY=7                                       # Độ lệch dọc vùng va chạm so với mép trên ảnh (px).

# ============================================================================
# 05. SÁT THƯƠNG VÀ MIỄN SÁT THƯƠNG
# ============================================================================
collision.normalDamage=1                                     # Số máu mất khi chạm thùng gỗ/vật cản thường; không tính lại liên tục khi còn tiếp xúc.
player.hitInvulnerabilitySeconds=1.1                         # Thời gian miễn sát thương thường sau khi bị trúng (giây); không chống va chạm chí mạng.
player.hitSlowMultiplier=0.92                                # Hệ số tốc độ ngang sau khi nhận sát thương thường; 0.92 = còn 92%.
player.hitSlowDurationSeconds=0.4                            # Thời gian giảm tốc ngang sau khi nhận sát thương thường (giây).
player.hitBlinkDurationSeconds=1.1                           # Thời gian nhân vật nhấp nháy khi mất máu (giây), kể cả va chạm chí mạng.
player.hitBlinkIntervalSeconds=0.1                           # Khoảng đổi giữa hiện và ẩn khi nhấp nháy do mất máu (giây).

# ============================================================================
# 06. TIẾN ĐỘ HOÀN THÀNH MÀN
# ============================================================================
progress.normalMultiplier=1                                  # Hệ số tiến độ cơ bản; 1 = bình thường, lớn hơn 1 = nhanh hơn.
progress.hitMultiplier=0.8                                   # Hệ số tiến độ lúc đang chịu phạt do trúng vật cản; 0.8 = còn 80%.
progress.hitPenaltyDurationSeconds=0.8                       # Thời gian giảm tiến độ sau khi nhận sát thương thường (giây).

# ============================================================================
# 07. CHỌN LOẠI VÀ NHỊP SINH VẬT CẢN
# ============================================================================
obstacles=shark,drain,floatingCrate                          # Các loại vật cản được phép sinh ở màn này, cách nhau bằng dấu phẩy.
spawn.mode=independent                                      # Mỗi loại xét xác suất riêng trong cùng lượt; có thể sinh nhiều loại nếu tất cả còn đường né.
spawn.minIntervalSeconds=0.45                               # Khoảng nghỉ cơ bản ngắn nhất giữa các lượt sinh (giây), còn chia cho hệ số độ khó.
spawn.maxIntervalSeconds=0.75                               # Khoảng nghỉ cơ bản dài nhất giữa các lượt sinh (giây); tăng mật độ nhưng không bỏ kiểm tra an toàn.
spawn.initialDelaySeconds=0.7                               # Thời gian chờ trước lượt sinh đầu tiên (giây).
spawn.maxActiveObstacles=16                                 # Giới hạn tổng vật cản/vật phẩm đang tồn tại; vẫn phải qua giới hạn từng làn và đường né.
spawn.randomSeed=random                                      # random = ngẫu nhiên mỗi lượt; nhập số nguyên để tái hiện cùng một chuỗi sinh.
spawn.margin=20                                              # Khoảng cách xuất hiện ngoài biên màn hình (px) trước khi vật cản đi vào.
spawn.attempts=8                                            # Số lần thử vị trí cho mỗi vật cản; không tìm được vị trí an toàn thì bỏ lượt, không ép sinh.
spawn.maxLifetimeSeconds=18                                  # Tuổi thọ tối đa của vật cản thông thường (giây); cá mập dùng chuỗi trạng thái riêng.

# --- GIỚI HẠN DỒN VẬT CẢN TRÊN CÙNG LÀN ---
spawn.maxObstaclesPerLane=3                                 # Tối đa ba vật cản trước hàng nhân vật trên một làn; vật phẩm không tính, vẫn kiểm tra đường thoát.
spawn.sameLaneGapPixels=100                                 # Khoảng hở dọc tối thiểu giữa các vật cản cùng làn khi đặt (px); dày hơn nhưng không chồng lên nhau.

# ============================================================================
# 08. KIỂM TRA ĐƯỜNG NÉ VÀ KHOẢNG CÁCH
# ============================================================================
spawn.safeReactionTimeSeconds=0.35                           # Thời gian phản ứng giả định khi kiểm tra đường né (giây); giữ hướng hiện tại trong khoảng này.
spawn.minimumGap=12                                          # Khoảng hở tối thiểu giữa hai vùng va chạm vật cản khi kiểm tra sinh (px).
spawn.horizonSeconds=4.5                                     # Khoảng dự báo tối thiểu (giây); tự kéo dài để kiểm tra cả vật cản đến muộn.
spawn.maxPredictionSeconds=20                                # Giới hạn dự báo (giây), phải đủ vòng đời vật cản cộng thời gian dự phòng.
spawn.escapeBufferSeconds=0.5                                # Khoảng dự phòng sau lúc vật cản cuối đi qua nhân vật (giây), tránh kết thúc kiểm tra giữa chỗ kẹt.
spawn.pathClearancePixels=8                                  # Khoảng dư ngang mỗi bên khi tìm đường né (px), tránh chỉ chừa khe quá sát; không đổi vùng va chạm thật.
spawn.stepSeconds=0.15                                       # Bước thời gian thử hướng di chuyển trong bộ kiểm tra đường né (giây).
spawn.gridPixels=18                                          # Độ rộng ô gộp các vị trí gần nhau trong kiểm tra đường né (px).
spawn.velocityGrid=70                                        # Độ rộng ô gộp các vận tốc gần nhau trong kiểm tra đường né (px/giây).
spawn.maxPlannerStates=120                                   # Số trạng thái vị trí/vận tốc tối đa giữ lại ở mỗi bước kiểm tra đường né.

# ============================================================================
# 09. ĐỘ KHÓ THEO TIẾN ĐỘ
# ============================================================================
difficulty.phase1End=0.25                                    # Mốc tiến độ kết thúc giai đoạn 1; 0.25 = 25% quãng đường.
difficulty.phase2End=0.67                                    # Mốc tiến độ kết thúc giai đoạn 2, bắt đầu giai đoạn 3; 0.67 = 67%.
difficulty.phase1SpawnMultiplier=1                           # Hệ số tần suất sinh giai đoạn 1; lớn hơn 1 = các đợt gần nhau hơn.
difficulty.phase2SpawnMultiplier=1.15                        # Hệ số tần suất sinh giai đoạn 2; khoảng chờ cơ bản được chia cho hệ số này.
difficulty.phase3SpawnMultiplier=1.35                        # Hệ số tần suất sinh giai đoạn 3; khoảng chờ cơ bản được chia cho hệ số này.

# ============================================================================
# 10. CHUYỂN ĐỘNG BĂNG NGANG
# ============================================================================
crossing.leadY=300                                           # Khoảng cách xuất hiện phía trước nhân vật của chim bay ngang (px); chó dùng dog.leadY riêng.

# ============================================================================
# 11. CÁ MẬP — VÂY, LẶN, CẢNH BÁO VÀ ĐỚP
# ============================================================================
shark.finDuration=0.7                                        # Thời gian vây cá bơi xuống từ biên trên trước khi lặn (giây).
shark.divingDuration=0.9                                     # Thời gian lặn tối thiểu trước khi chọn nơi đớp (giây); có thể chờ thêm nếu chưa an toàn.
shark.warningDuration=1.2                                    # Thời gian cảnh báo tại vị trí cá sắp đớp (giây).
shark.attackDuration=0.4                                     # Thời gian cá trồi lên và có va chạm gây mất máu/làm chậm (giây).
shark.finSpeed=140                                           # Tốc độ vây cá bơi xuống trong giai đoạn đầu (px/giây).
shark.finWidth=36                                            # Chiều rộng hình vây tạm khi chưa có ảnh (px).
shark.finHeight=40                                           # Chiều cao hình vây tạm; cũng dùng để căn vị trí xuất hiện vây ở biên trên (px).
shark.rippleSize=24                                          # Đường kính dấu nước tạm tại chỗ cá lặn khi chưa có ảnh (px).
shark.blinkSeconds=0.12                                      # Khoảng thời gian giữa hai lần đổi sáng/tắt của cảnh báo cá (giây).

# --- SÁT THƯƠNG VÀ LÀM CHẬM KHI CÁ ĐỚP ---
shark.damage=1                                               # Số máu mất mỗi lần bị cá mập đớp; có nhấp nháy và miễn sát thương thường, không trừ liên tục trong cùng lần chạm.
shark.slowMultiplier=0.65                                    # Hệ số tốc độ ngang còn lại khi bị cá đớp; 0.65 = chậm 35%.
shark.progressMultiplier=0.65                                # Hệ số cuộn cảnh/tiến độ khi bị cá đớp; 0.65 = còn 65%, độc lập với hiệu ứng cống.
shark.slowDurationSeconds=1.2                                # Thời gian làm chậm sau khi cá đớp (giây); 0 = tắt làm chậm, vẫn gây sát thương.


# ============================================================================
# 12. HIỆU ỨNG CỐNG
# ============================================================================
drain.slowMultiplier=0.65                                    # Hệ số tốc độ ngang khi trúng cống; 0.65 = còn 65%.
drain.progressMultiplier=0.65                                # Hệ số tiến độ và cuộn cảnh khi trúng cống; 0.65 = còn 65%.
drain.durationSeconds=1.2                                    # Thời gian tác dụng của hiệu ứng cống (giây).
drain.damage=1                                               # Số máu mất khi chạm cống; vẫn chịu làm chậm, có miễn sát thương để tránh mất máu liên tục.

# ============================================================================
# 13. HIỆU ỨNG TRƯỢT BĂNG
# ============================================================================
ice.speedMultiplier=1.12                                     # Hệ số tốc độ ngang tối đa trên băng; 1.12 = 112% tốc độ hiện tại.
ice.decelerationMultiplier=0.3                               # Hệ số lực hãm khi trượt băng; càng nhỏ càng khó dừng hoặc đổi hướng.
ice.durationSeconds=1.5                                      # Thời gian còn bị trượt sau khi chạm băng (giây).

# ============================================================================
# 14. HIỆU ỨNG BÓNG TUYẾT
# ============================================================================
snowball.freezeDuration=0.6                                  # Thời gian nhân vật bị đóng băng, không di chuyển ngang (giây).
snowball.freezeProgressMultiplier=0                          # Hệ số tiến độ và cuộn cảnh lúc đóng băng; 0 = dừng tiến hoàn toàn.
snowball.slowMultiplier=0.6                                  # Hệ số tốc độ ngang còn lại trong hiệu ứng tuyết, rõ nhất sau khi hết đóng băng.
snowball.slowDurationSeconds=1.5                             # Thời gian còn chậm thêm sau khi hết đóng băng (giây).
snowball.progressMultiplier=0.5                              # Hệ số tiến độ và cuộn cảnh khi còn chậm do tuyết sau đóng băng.

# ============================================================================
# 15. NĂNG LƯỢNG VÀ TIẾP TẾ
# ============================================================================
energy.enabled=false                                         # true = bật hệ năng lượng; false = không tiêu hao, không sinh thanh năng lượng.
energy.initial=100                                           # Năng lượng ban đầu của nhân vật, không vượt quá energy.max.
energy.max=100                                               # Năng lượng tối đa; đầy thanh tương ứng 100%.
energy.drainPerSecond=2                                      # Lượng năng lượng tiêu hao mỗi giây thực tế trong lúc chơi.
energy.recovery=30                                           # Lượng năng lượng được hồi khi nhặt một thanh.
energy.minimumReserve=20                                     # Ngưỡng năng lượng dự trữ dùng để quyết định tạo thanh tiếp tế khẩn cấp.
energy.pickupIntervalSeconds=10                              # Khoảng thời gian giữa các lượt tạo thanh tiếp tế thường (giây).
energy.pickupTravelSeconds=1.4                               # Thời gian dự kiến để thanh tiếp tế thường tới hàng nhân vật (giây).
energy.urgentTravelSeconds=0.5                               # Thời gian dự kiến để thanh tiếp tế khẩn cấp tới hàng nhân vật (giây).
energy.pickupWidth=34                                        # Chiều rộng hình và vùng nhặt thanh năng lượng (px).
energy.pickupHeight=34                                       # Chiều cao hình và vùng nhặt thanh năng lượng (px).
energy.maxSlowdown=0.2                                       # Mức giảm tốc tối đa khi cạn năng lượng; 0.2 = chậm tối đa 20%, giảm tuyến tính theo năng lượng.
energy.pickupBoostMultiplier=1.4                             # Hệ số tốc độ khi nhặt năng lượng; 1.4 = 140% bình thường, tạm thay mức chậm do mệt.
energy.pickupBoostDurationSeconds=2                          # Thời gian tăng tốc sau khi nhặt năng lượng (giây).

# ============================================================================
# 16. HIỆU ỨNG CHÓI MẮT
# ============================================================================
glare.enabled=false                                          # true = bật hiệu ứng chói làm mờ vật cản ở xa; false = tắt.
glare.types=bus,cactus                                       # Các loại vật cản chịu hiệu ứng chói, cách nhau bằng dấu phẩy.
glare.minAlpha=0.4                                           # Độ rõ thấp nhất của vật cản ở xa (0.1..1); càng nhỏ càng mờ, 1 = hoàn toàn rõ.
glare.clearY=300                                             # Tọa độ Y mà vật cản đã hiện rõ hoàn toàn (px).

# ============================================================================
# 17. VẬT CẢN — CÁ MẬP
# ============================================================================
spawn.shark.weight=40                                        # Trọng số sinh cá mập khi spawn.mode=weighted; 0 = không chọn, không phải phần trăm.
shark.chance=70                                             # Xác suất xét sinh cá mập mỗi lượt (%), độc lập cống và thùng trôi.
shark.width=160                                              # Chiều rộng ảnh và vùng va chạm của cá mập (px).
shark.height=160                                             # Chiều cao ảnh và vùng va chạm của cá mập (px).
shark.minSpeed=0                                             # Thông số tốc độ chung không dùng cho cá mập; chỉnh tốc độ vây ở shark.finSpeed.
shark.maxSpeed=0                                             # Thông số tốc độ chung không dùng cho cá mập; chỉnh tốc độ vây ở shark.finSpeed.
shark.collisionType=SHARK_SLOW                               # Cá đớp gây shark.damage máu và làm chậm theo nhóm shark; không phải va chạm chí mạng.
shark.consumed=false                                         # true = xóa sau va chạm không chí mạng; false = giữ lại cho tới khi ra khỏi màn hoặc hết vòng đời.
sprite.shark=/image/day2/shark.png                           # Đường dẫn ảnh cá mập trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# 18. VẬT CẢN — CỐNG
# ============================================================================
spawn.drain.weight=35                                        # Trọng số sinh cống khi spawn.mode=weighted; 0 = không chọn, không phải phần trăm.
drain.chance=85                                             # Xác suất xét sinh cống mỗi lượt (%), độc lập các vật cản khác.
drain.width=170                                              # Chiều rộng ảnh và vùng va chạm của cống (px).
drain.height=100                                             # Chiều cao ảnh và vùng va chạm của cống (px).
drain.minSpeed=0                                             # Thông số tốc độ của mẫu vật cản tĩnh, hiện không dùng; tốc độ cuộn lấy từ level.scrollSpeed.
drain.maxSpeed=0                                             # Thông số tốc độ của mẫu vật cản tĩnh, hiện không dùng; tốc độ cuộn lấy từ level.scrollSpeed.
drain.collisionType=SLOW                                     # Kiểu va chạm: LETHAL = chết ngay; NORMAL_DAMAGE = mất máu; SLOW = chậm; SLIDE = trượt; FREEZE = đóng băng.
drain.consumed=false                                         # true = xóa sau va chạm không chí mạng; false = giữ lại cho tới khi ra khỏi màn hoặc hết vòng đời.
sprite.drain=/image/day2/drain.png                           # Đường dẫn ảnh cống trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# 19. VẬT CẢN — THÙNG TRÔI
# ============================================================================
spawn.floatingCrate.weight=25                                # Trọng số sinh thùng trôi khi spawn.mode=weighted; 0 = không chọn, không phải phần trăm.
floatingCrate.chance=80                                     # Xác suất xét sinh thùng trôi mỗi lượt (%), độc lập các vật cản khác.
floatingCrate.width=160                                      # Chiều rộng ảnh và vùng va chạm của thùng trôi (px).
floatingCrate.height=120                                     # Chiều cao ảnh và vùng va chạm của thùng trôi (px).
floatingCrate.minSpeed=25                                    # Tốc độ trôi ngang nhỏ nhất của thùng (px/giây); chuyển động dọc theo cuộn cảnh.
floatingCrate.maxSpeed=50                                    # Tốc độ trôi ngang lớn nhất của thùng (px/giây); chuyển động dọc theo cuộn cảnh.
floatingCrate.collisionType=NORMAL_DAMAGE                    # Chạm thùng gỗ gây sát thương thường: mất 1 máu theo collision.normalDamage, không chí mạng.
floatingCrate.consumed=true                                  # true = xóa sau va chạm không chí mạng; false = giữ lại cho tới khi ra khỏi màn hoặc hết vòng đời.
sprite.floatingCrate=/image/day2/floatingCrate.png           # Đường dẫn ảnh thùng trôi trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# 20. ĐƯỜNG DẪN HÌNH ẢNH
# ============================================================================
sprite.player=/image/common/player/player.png                # Đường dẫn ảnh nhân vật trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.energyPickup=/image/day4/energy.png                   # Đường dẫn ảnh thanh năng lượng trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.fin=/image/day2/fin.png                         # Đường dẫn ảnh vây cá mập trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.diving=/image/day2/ripple.png                   # Đường dẫn ảnh dấu nước lúc cá lặn trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.warning=/image/day2/warning.png                 # Đường dẫn ảnh cảnh báo cá mập trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.attack=/image/day2/shark.png                    # Đường dẫn ảnh cá mập đớp trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.background=/image/day2/background.png                 # Đường dẫn ảnh nền toàn màn hình trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.road=/image/day2/road.png                             # Đường dẫn ảnh mặt đường trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# 21. VẬT PHẨM HỒI MÁU
# ============================================================================
healthPickup.enabled=true                                   # Bật các hộp hồi máu riêng, sinh độc lập với vật cản và vật phẩm năng lượng.
healthPickup.randomCount=5                                  # Tổng số hộp hồi máu rải ngẫu nhiên mỗi lượt chơi; 0 = dùng lịch cố định hoặc nhịp thời gian như cũ.
healthPickup.randomStartSeconds=3                           # Bắt đầu khoảng rải hộp theo tiến độ hiệu dụng (giây); mỗi lượt chơi chọn thời điểm khác nhau.
healthPickup.randomEndSeconds=29                            # Kết thúc khoảng chọn thời điểm sinh theo tiến độ (giây); chừa thời gian để hộp cuối tới nhân vật.
healthPickup.amount=1                                       # Mỗi hộp hồi một máu, không vượt player.maxHealth.
healthPickup.firstDelaySeconds=3                            # Chờ hộp đầu nếu randomCount=0 và không có spawnTimesSeconds (giây).
healthPickup.minIntervalSeconds=6                           # Khoảng nghỉ ngắn nhất nếu dùng nhịp thời gian thay cho lịch/ngẫu nhiên số lượng (giây).
healthPickup.maxIntervalSeconds=8                           # Khoảng nghỉ dài nhất nếu dùng nhịp thời gian thay cho lịch/ngẫu nhiên số lượng (giây).
healthPickup.retrySeconds=0.35                              # Thử lại sau khoảng này nếu còn hộp trước hoặc chưa có đường nhặt an toàn (giây); không tăng số lượng.
healthPickup.width=40                                       # Chiều rộng ảnh và vùng nhặt hộp hồi máu (px).
healthPickup.height=40                                      # Chiều cao ảnh và vùng nhặt hộp hồi máu (px).
healthPickup.speed=220                                      # Tốc độ hộp trôi từ biên trên xuống (px/giây); ảnh hưởng thời gian tới nhân vật.
sprite.healthPickup=/image/day2/health.png                  # Ảnh hộp hồi máu của màn; thiếu ảnh dùng hộp đỏ có dấu cộng trắng.

# ============================================================================
# 22. CAO TRÀO — ĐỢT CÁ MẬP
# ============================================================================
event.type=sharkRush                                         # sharkRush = đợt cá riêng, tạm ngừng sinh cống/thùng/cá thường; none = tắt cao trào.
event.startSeconds=14                                        # Mốc tiến độ hiệu dụng bắt đầu cảnh báo đợt cá (giây).
event.warningSeconds=1.2                                     # Thời gian báo trước trên màn hình trước khi chờ đường thông và bắt đầu cao trào (giây).
event.clearTimeoutSeconds=7                                  # Chờ vật cản cũ đi hết tối đa (giây); đầu sự kiện còn chật thì bỏ sự kiện, cuối sự kiện hết chờ thì trả quyền sinh thường.
event.maxDurationSeconds=16                                 # Thời gian tối đa thử sinh các đội hình cá mập (giây), không tính cảnh báo/chờ đường cũ.
event.retrySeconds=0.35                                      # Khoảng chờ thử lại nếu cả đợt chưa đặt được an toàn (giây); không ép sinh hoặc xóa vật cản cũ.
event.sharks.waveCount=5                                    # Số đội hình cá mập tối đa, không phải số cá; mỗi đội hình có một, hai hoặc ba con theo kiểu đớp.
event.sharks.intervalSeconds=2                              # Khoảng nghỉ tối thiểu giữa hai đội hình sinh thành công (giây); còn phải đủ chỗ và có đường né.
event.sharks.maxActive=3                                    # Tối đa ba cá thuộc các đội hình cùng tồn tại; ba con chỉ đớp lần lượt, không khóa cả ba làn cùng lúc.
event.sharks.singleWeight=1                                 # Trọng số kiểu đớp một làn ngẫu nhiên; ba trọng số bằng nhau tương ứng mỗi kiểu khoảng 33,3%.
event.sharks.pairWeight=1                                   # Trọng số kiểu hai cá đớp đồng thời ở hai làn khác nhau; luôn chừa một làn.
event.sharks.sequenceWeight=1                               # Trọng số kiểu ba cá cảnh báo và đớp lần lượt làn 1 rồi 2 rồi 3, không đớp cả ba cùng lúc.
event.sharks.sequenceDelaySeconds=0.5                       # Độ lệch thời điểm bắt đầu cảnh báo/đớp giữa hai làn liên tiếp của kiểu 1–2–3 (giây).

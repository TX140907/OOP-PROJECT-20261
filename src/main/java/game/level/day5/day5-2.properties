# MÀN 5-2: 30 GIÂY NÉ VẬT CẢN, SAU ĐÓ ĐẤU BOSS TỚI KHI BẮN HẠ.
# Các thông số nằm cạnh code; sửa xong chạy lại run.cmd để build vào game.
# Đơn vị: px = điểm ảnh; tốc độ = px/giây; thời gian = giây; xác suất = phần trăm.
# Ghi chú bắt đầu bằng dấu # có khoảng trắng phía trước; giữ nguyên mã màu #RRGGBB.
# Phần thường giữ độ khó cố định; chậm làm giảm tiến độ như các màn khác.
# Boss: chờ đường thông -> cảnh báo -> xuất hiện -> nạp máu -> chọn chuỗi 1 -> 3 hoặc đòn 2.
# E bắn thẳng lên sau khi nạp máu xong; boss chỉ mất máu khi trúng tên lửa.

# ============================================================================
# 01. MÀN CHƠI VÀ PHẦN NÉ VẬT CẢN 30 GIÂY
# ============================================================================
level.durationSeconds=15                                      # Thời gian tiến hiệu dụng phần thường trước boss (giây); chưa kết thúc màn khi hết mốc này.
level.initialHealth=5                                         # Số máu ban đầu khi bắt đầu hoặc chơi lại màn.
level.mode=air                                                # road = đường bộ; air = bầu trời, dùng nhân vật trực thăng.
level.scrollSpeed=80                                          # Tốc độ cuộn cảnh cơ bản (px/giây); vật đứng yên trong thế giới trôi theo tốc độ này.
level.backgroundColor=#467ca2                                 # Màu nền hai bên hoặc bầu trời, theo mã màu #RRGGBB.
level.roadColor=#343b46                                       # Màu mặt đường khi chưa có ảnh đường, theo mã màu #RRGGBB.
level.id=52                                                   # Mã màn: 1, 2, 3, 4, 51 (đường bộ ngày 5) hoặc 52 (trực thăng).
level.name=Ngày 5 - Trực thăng                                # Tên màn hiển thị trên thanh thông tin trong game.
obstacles=bird,enemyPlane                                     # Các loại vật cản được phép sinh ở màn này, cách nhau bằng dấu phẩy.

# ============================================================================
# 02. NHÂN VẬT VÀ VA CHẠM
# ============================================================================
player.maxHealth=5                                            # Số máu tối đa; vật phẩm hồi máu không tăng quá mức này.
player.width=120                                              # Chiều rộng hình nhân vật (px); ảnh và giới hạn mép phải dùng kích thước này.
player.height=90                                              # Chiều cao hình nhân vật (px).
player.y=520                                                  # Tọa độ mép trên nhân vật (px), tăng từ trên xuống; nhân vật không tự đổi Y.
player.minX=140                                               # Tọa độ mép trái nhỏ nhất của nhân vật (px).
player.maxX=740                                               # X tối đa = 860 - player.width, giữ toàn bộ trực thăng trong vùng giữa.
player.maxSpeed=420                                           # Tốc độ ngang tối đa khi không có hiệu ứng (px/giây).
player.acceleration=1500                                      # Gia tốc ngang khi giữ phím di chuyển (px/giây²).
player.deceleration=2000                                      # Độ giảm tốc khi thả phím hoặc hãm để đổi hướng (px/giây²).
player.hitboxWidth=84                                         # Chiều rộng vùng va chạm của nhân vật (px), có thể nhỏ hơn ảnh.
player.hitboxHeight=54                                        # Chiều cao vùng va chạm của nhân vật (px).
player.hitboxOffsetX=18                                       # Căn giữa hitbox 84 px trong trực thăng rộng 120 px: (120 - 84) / 2.
player.hitboxOffsetY=18                                       # Căn giữa hitbox 54 px trong trực thăng cao 90 px: (90 - 54) / 2.
player.hitInvulnerabilitySeconds=1.1                          # Thời gian miễn sát thương thường sau khi bị trúng (giây); không chống va chạm chí mạng.
player.hitBlinkDurationSeconds=1.1                            # Thời gian nhân vật nhấp nháy khi mất máu (giây), kể cả va chạm chí mạng.
player.hitBlinkIntervalSeconds=0.1                            # Khoảng đổi giữa hiện và ẩn khi nhấp nháy do mất máu (giây).
player.hitSlowMultiplier=0.92                                 # Hệ số tốc độ ngang sau khi nhận sát thương thường; 0.92 = còn 92%.
player.hitSlowDurationSeconds=0.4                             # Thời gian giảm tốc ngang sau khi nhận sát thương thường (giây).
collision.normalDamage=1                                      # Số máu mất mỗi lần va chạm thường; không tính lại liên tục khi còn tiếp xúc.

# ============================================================================
# 03. TIẾN ĐỘ
# ============================================================================
progress.normalMultiplier=1                                   # Hệ số tiến độ cơ bản; 1 = bình thường, lớn hơn 1 = nhanh hơn.
progress.hitMultiplier=0.8                                    # Hệ số tiến độ lúc đang chịu phạt do trúng vật cản; 0.8 = còn 80%.
progress.hitPenaltyDurationSeconds=0.8                        # Thời gian giảm tiến độ sau khi nhận sát thương thường (giây).

# ============================================================================
# 04. SINH VẬT CẢN VÀ DỰ BÁO ĐƯỜNG NÉ
# ============================================================================
spawn.mode=weighted                                           # weighted = chọn theo trọng số; independent = xét xác suất từng loại độc lập.
spawn.minIntervalSeconds=1.1                                  # Khoảng thời gian cơ bản ngắn nhất giữa hai đợt xét sinh (giây).
spawn.maxIntervalSeconds=1.7                                  # Khoảng thời gian cơ bản dài nhất giữa hai đợt xét sinh (giây).
spawn.maxActiveObstacles=8                                    # Số vật thể hoạt động tối đa do sinh thường và tên lửa; nguồn năng lượng được xét riêng.
spawn.initialDelaySeconds=1.5                                 # Thời gian chờ từ đầu màn tới đợt xét sinh đầu tiên (giây).
spawn.randomSeed=random                                       # random = ngẫu nhiên mỗi lượt; nhập số nguyên để tái hiện cùng một chuỗi sinh.
spawn.safeReactionTimeSeconds=0.35                            # Thời gian phản ứng giả định khi kiểm tra đường né (giây); giữ hướng hiện tại trong khoảng này.
spawn.minimumGap=12                                           # Khoảng hở tối thiểu giữa hai vùng va chạm vật cản khi kiểm tra sinh (px).
spawn.margin=20                                               # Khoảng cách xuất hiện ngoài biên màn hình (px) trước khi vật cản đi vào.
spawn.attempts=6                                              # Số lần thử vị trí cho mỗi vật cản hoặc lượt đặt năng lượng; không an toàn thì bỏ hoặc thử lại sau.
spawn.maxLifetimeSeconds=18                                   # Tuổi thọ tối đa của vật cản thông thường (giây); cá mập dùng chuỗi trạng thái riêng.
spawn.horizonSeconds=4.5                                      # Khoảng dự báo tối thiểu (giây); tự kéo dài để kiểm tra cả vật cản đến muộn.
spawn.maxPredictionSeconds=20                                 # Giới hạn dự báo (giây), phải đủ vòng đời vật cản cộng thời gian dự phòng.
spawn.escapeBufferSeconds=0.5                                 # Khoảng dự phòng sau lúc vật cản cuối đi qua nhân vật (giây).
spawn.pathClearancePixels=8                                   # Khoảng dư ngang mỗi bên khi tìm đường né (px); không đổi hitbox thật.
spawn.stepSeconds=0.15                                        # Bước thời gian thử hướng di chuyển trong bộ kiểm tra đường né (giây).
spawn.gridPixels=18                                           # Độ rộng ô gộp các vị trí gần nhau trong kiểm tra đường né (px).
spawn.velocityGrid=70                                         # Độ rộng ô gộp các vận tốc gần nhau trong kiểm tra đường né (px/giây).
spawn.maxPlannerStates=120                                    # Số trạng thái vị trí/vận tốc tối đa giữ lại ở mỗi bước kiểm tra đường né.

# ============================================================================
# 05. ĐỘ KHÓ CỐ ĐỊNH
# ============================================================================
difficulty.mode=fixed                                         # fixed = giữ một mức khó suốt phần thường, không chia ba giai đoạn.
difficulty.fixedSpawnMultiplier=1.35                          # Mật độ sinh vật cản cố định, dùng ngay mức khó cao từ đầu màn.

# ============================================================================
# 06. HIỆU ỨNG DÙNG CHUNG KHI THÊM VẬT CẢN MỚI
# ============================================================================
shark.finDuration=0.7                                         # Thời gian vây cá bơi xuống từ biên trên trước khi lặn (giây).
shark.divingDuration=0.9                                      # Thời gian lặn tối thiểu trước khi chọn nơi đớp (giây); có thể chờ thêm nếu chưa an toàn.
shark.warningDuration=1.2                                     # Thời gian cảnh báo tại vị trí cá sắp đớp (giây).
shark.attackDuration=0.4                                      # Thời gian cá trồi lên và có va chạm chí mạng (giây).
shark.finSpeed=140                                            # Tốc độ vây cá bơi xuống trong giai đoạn đầu (px/giây).
shark.finWidth=36                                             # Chiều rộng hình vây tạm khi chưa có ảnh (px).
shark.finHeight=40                                            # Chiều cao hình vây tạm; cũng dùng để căn vị trí xuất hiện vây ở biên trên (px).
shark.rippleSize=24                                           # Đường kính dấu nước tạm tại chỗ cá lặn khi chưa có ảnh (px).
shark.blinkSeconds=0.12                                       # Khoảng thời gian giữa hai lần đổi sáng/tắt của cảnh báo cá (giây).
drain.slowMultiplier=0.65                                     # Hệ số tốc độ ngang khi trúng cống; 0.65 = còn 65%.
drain.progressMultiplier=0.65                                 # Hệ số tiến độ và cuộn cảnh khi trúng cống; 0.65 = còn 65%.
drain.durationSeconds=1.2                                     # Thời gian tác dụng của hiệu ứng cống (giây).
drain.damage=1                                                # Số máu mất khi chạm cống; có thời gian miễn sát thương để tránh mất máu liên tục.
ice.speedMultiplier=1.12                                      # Hệ số tốc độ ngang tối đa trên băng; 1.12 = 112% tốc độ hiện tại.
ice.decelerationMultiplier=0.3                                # Hệ số lực hãm khi trượt băng; càng nhỏ càng khó dừng hoặc đổi hướng.
ice.durationSeconds=1.5                                       # Thời gian còn bị trượt sau khi chạm băng (giây).
snowball.freezeDuration=0.6                                   # Thời gian nhân vật bị đóng băng, không di chuyển ngang (giây).
snowball.freezeProgressMultiplier=0                           # Hệ số tiến độ và cuộn cảnh lúc đóng băng; 0 = dừng tiến hoàn toàn.
snowball.slowMultiplier=0.6                                   # Hệ số tốc độ ngang còn lại trong hiệu ứng tuyết, rõ nhất sau khi hết đóng băng.
snowball.slowDurationSeconds=1.5                              # Thời gian còn chậm thêm sau khi hết đóng băng (giây).
snowball.progressMultiplier=0.5                               # Hệ số tiến độ và cuộn cảnh khi còn chậm do tuyết sau đóng băng.
crossing.leadY=300                                            # Khoảng cách xuất hiện phía trước nhân vật của chim bay ngang (px); chó dùng dog.leadY riêng.

# ============================================================================
# 07. NĂNG LƯỢNG
# ============================================================================
energy.maxSlowdown=0.2                                        # Mức giảm tốc tối đa khi cạn năng lượng; 0.2 = chậm tối đa 20%, giảm tuyến tính theo năng lượng.
energy.pickupBoostMultiplier=1.4                              # Hệ số tốc độ khi nhặt năng lượng; 1.4 = 140% bình thường, tạm thay mức chậm do mệt.
energy.pickupBoostDurationSeconds=2                           # Thời gian tăng tốc sau khi nhặt năng lượng (giây).
energy.enabled=false                                          # true = bật hệ năng lượng; false = không tiêu hao, không sinh thanh năng lượng.
energy.initial=100                                            # Năng lượng ban đầu của nhân vật, không vượt quá energy.max.
energy.max=100                                                # Năng lượng tối đa; đầy thanh tương ứng 100%.
energy.drainPerSecond=2                                       # Lượng năng lượng tiêu hao mỗi giây thực tế trong lúc chơi.
energy.recovery=30                                            # Lượng năng lượng được hồi khi nhặt một thanh.
energy.minimumReserve=20                                      # Ngưỡng năng lượng dự trữ dùng để quyết định tạo thanh tiếp tế khẩn cấp.
energy.pickupIntervalSeconds=10                               # Khoảng thời gian giữa các lượt tạo thanh tiếp tế thường (giây).
energy.pickupTravelSeconds=1.4                                # Thời gian dự kiến để thanh tiếp tế thường tới hàng nhân vật (giây).
energy.urgentTravelSeconds=0.5                                # Thời gian dự kiến để thanh tiếp tế khẩn cấp tới hàng nhân vật (giây).
energy.pickupWidth=34                                         # Chiều rộng hình và vùng nhặt thanh năng lượng (px).
energy.pickupHeight=34                                        # Chiều cao hình và vùng nhặt thanh năng lượng (px).

# ============================================================================
# 08. HỒI MÁU PHẦN THƯỜNG
# ============================================================================
healthPickup.enabled=true                                     # true = thỉnh thoảng sinh vật phẩm hồi máu, độc lập với trọng số vật cản.
healthPickup.amount=1                                         # Số máu hồi khi nhặt; không vượt player.maxHealth.
healthPickup.firstDelaySeconds=14                             # Phần thường: vật phẩm hồi máu đầu tiên sau 14 giây.
healthPickup.minIntervalSeconds=14                            # Phần thường: cách nhau 14 giây sau mỗi lần sinh thành công.
healthPickup.maxIntervalSeconds=14                            # Bằng minIntervalSeconds để lịch phần thường không ngẫu nhiên.
healthPickup.retrySeconds=1                                   # Thời gian chờ thử lại khi chưa tìm được vị trí an toàn (giây).
healthPickup.width=40                                         # Chiều rộng vật phẩm hồi máu (px).
healthPickup.height=40                                        # Chiều cao vật phẩm hồi máu (px).
healthPickup.speed=140                                        # Tốc độ vật phẩm bay từ biên trên xuống (px/giây).
sprite.healthPickup=/image/day5/health.png                    # Ảnh vật phẩm hồi máu; chưa có ảnh thì vẽ hộp đỏ dấu cộng trắng.

# ============================================================================
# 09. CHIM BAY VÀO RỒI CÓ THỂ DỪNG
# ============================================================================
spawn.bird.weight=45                                          # Trọng số chọn chim ở phần thường khi spawn.mode=weighted; 0 = không chọn chim.
bird.chance=100                                               # Xác suất sinh chim độc lập ở phần thường khi spawn.mode=independent (%).
bird.stationaryChance=20                                      # Xác suất chim dừng trên một làn sau khi bay vào từ biên (%); không sinh chim đứng sẵn.
bird.width=170                                                # Chiều rộng chim (px), đủ che khe giữa hai làn khi chim dừng trên đường.
bird.height=45                                                # Chiều cao hình chim và vùng va chạm (px).
bird.minSpeed=160                                             # Tốc độ bay ngang tối thiểu của chim trước khi dừng hoặc bay xuyên qua (px/giây).
bird.maxSpeed=220                                             # Tốc độ bay ngang tối đa của chim (px/giây).
bird.collisionType=NORMAL_DAMAGE                              # NORMAL_DAMAGE = va chạm chim gây sát thương thường, có miễn sát thương tạm thời.
bird.consumed=true                                            # true = chim biến mất sau va chạm gây sát thương; đang có khiên thì đi xuyên qua.
sprite.bird=/image/day5/bird.png                              # Ảnh chim nhìn ngang; code điều khiển chuyển động và quyết định dừng.

# ============================================================================
# 10. MÁY BAY VÀ TÊN LỬA ĐỊCH
# ============================================================================
spawn.enemyPlane.weight=65                                    # Trọng số chọn máy bay ở phần thường khi spawn.mode=weighted.
enemyPlane.chance=100                                         # Xác suất sinh máy bay độc lập ở phần thường khi spawn.mode=independent (%).
enemyPlane.width=240                                          # Chiều rộng máy bay (px); 240 là đúng một làn, va chạm bám theo hình đa giác.
enemyPlane.tailOffsetX=24                                    # Độ lệch ngang lúc sinh để tránh bám đuôi (px); giữ toàn bộ máy bay trong vùng giữa X=140–860.
enemyPlane.tailAlignmentPixels=8                             # Hai tâm máy bay lệch X không quá mức này (px) được coi là thẳng hàng; phải nhỏ hơn tailOffsetX.
enemyPlane.tailGapPixels=500                                 # Khoảng trống dọc tối đa từ đuôi máy bay trước tới mũi máy bay sau để xét bám đuôi (px).
enemyPlane.height=140                                         # Chiều cao máy bay (px).
enemyPlane.hitsToDestroy=2                                   # Số phát tên lửa người chơi trúng để phá máy bay, áp dụng cả máy bay thường và boss gọi.
enemyPlane.hitFlashSeconds=0.12                              # Thời gian máy bay lóe sáng sau khi trúng đạn (giây); chưa đủ số phát thì chưa nổ.
enemyPlane.minSpeed=200                                       # Tốc độ tối thiểu của máy bay thường/gọi riêng trong đòn 2 (px/giây).
enemyPlane.maxSpeed=260                                       # Tốc độ tối đa của máy bay thường/gọi riêng trong đòn 2 (px/giây).
enemyPlane.damage=2                                          # Số máu mất mỗi lần chạm thân máy bay, áp dụng máy bay thường, đòn 1/2 và bay ngược đòn 3.
enemyPlane.collisionType=PLANE_DAMAGE                         # PLANE_DAMAGE = chạm máy bay mất enemyPlane.damage máu, có nhấp nháy/miễn sát thương và khiên bảo vệ.
enemyPlane.consumed=false                                     # false = máy bay tiếp tục bay sau va chạm; tên lửa của người chơi vẫn có thể phá nó.
enemyPlane.firstShotDelaySeconds=0.5                          # Thời gian chờ bắn tên lửa lần đầu (giây), chỉ áp dụng máy bay có vũ khí.
enemyPlane.shotIntervalSeconds=1.5                            # Khoảng cách giữa hai lần thử phóng tên lửa của một máy bay (giây).
enemyPlane.minFireY=70                                        # Chỉ bắn khi mép trên máy bay đã xuống tới Y này (px).
enemyPlane.maxFireY=280                                       # Ngừng bắn khi mép trên máy bay qua Y này (px).
sprite.enemyPlane=/image/day5/enemyPlane.png                  # Ảnh máy bay hướng mũi xuống, dùng chung máy bay thường và boss triệu hồi.
missile.speedMultiplier=2                                     # Tốc độ tên lửa địch bằng player.maxSpeed nhân hệ số này.
missile.warningSeconds=0.2                                    # Thời gian cảnh báo trước khi tên lửa địch bắt đầu bay (giây).
missile.blinkSeconds=0.05                                     # Khoảng đổi hiện/ẩn của cảnh báo tên lửa địch (giây).
missile.sideOffset=50                                         # Khoảng lệch ngang điểm phóng tính từ tâm máy bay (px); chọn ngẫu nhiên trái/phải.
missile.warningSize=52                                        # Kích thước cảnh báo tên lửa tại hàng nhân vật (px).
missile.width=18                                              # Chiều rộng tên lửa địch (px).
missile.height=36                                             # Chiều cao tên lửa địch (px).
missile.collisionType=NORMAL_DAMAGE                           # NORMAL_DAMAGE = tên lửa địch gây sát thương thường; LETHAL = chết ngay nếu không có khiên.
sprite.missile=/image/day5/missile.png                        # Ảnh tên lửa địch, mũi hướng xuống.
sprite.missile.warning=/image/day5/missile-warning.png        # Ảnh cảnh báo tên lửa địch; code tự nhấp nháy.

# ============================================================================
# 11. HIỂN THỊ VÀ ẢNH CHUNG
# ============================================================================
glare.enabled=false                                           # true = bật hiệu ứng chói làm mờ vật cản ở xa; false = tắt.
glare.types=bus,cactus                                        # Các loại vật cản chịu hiệu ứng chói, cách nhau bằng dấu phẩy.
glare.minAlpha=0.4                                            # Độ rõ thấp nhất của vật cản ở xa (0.1..1); càng nhỏ càng mờ, 1 = hoàn toàn rõ.
glare.clearY=300                                              # Tọa độ Y mà vật cản đã hiện rõ hoàn toàn (px).
road.overlayLines=false                                       # true = vẽ thêm vạch lên ảnh đường; false = không đè vạch lên ảnh thật; thiếu ảnh vẫn vẽ vạch tạm.
sprite.player=/image/day5/helicopter.png                      # Đường dẫn ảnh nhân vật trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.energyPickup=/image/day4/energy.png                    # Đường dẫn ảnh thanh năng lượng trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.fin=/image/day2/fin.png                          # Đường dẫn ảnh vây cá mập trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.diving=/image/day2/ripple.png                    # Đường dẫn ảnh dấu nước lúc cá lặn trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.warning=/image/day2/warning.png                  # Đường dẫn ảnh cảnh báo cá mập trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.shark.attack=/image/day2/shark.png                     # Đường dẫn ảnh cá mập đớp trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.background=/image/day5/background.png                  # Đường dẫn ảnh nền toàn màn hình trong tài nguyên; chưa có ảnh thì dùng hình tạm.
sprite.road=/image/day5/road.png                              # Đường dẫn ảnh mặt đường trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# BOSS 01. XUẤT HIỆN, KÍCH THƯỚC VÀ MÁU
# ============================================================================
boss.enabled=true                                             # true = sau phần thường sẽ đánh boss; false = hoàn thành ngay khi hết tiến độ.
boss.clearDelaySeconds=1.5                                    # Chờ thêm sau khi mọi vật cản cũ đã đi hết (giây), rồi mới hiện cảnh báo boss.
boss.warningSeconds=1.2                                       # Thời gian dấu chấm than báo boss cạnh nhân vật (giây).
boss.warningBlinkSeconds=0.15                                 # Khoảng đổi hiện/ẩn của dấu chấm than (giây).
boss.warningSize=38                                           # Kích thước ô dấu chấm than (px).
boss.warningOffsetX=12                                        # Khoảng cách dấu chấm than tới cạnh nhân vật (px).
boss.width=100                                                # Chiều rộng boss hình người/hình chữ nhật tạm (px), vừa khoảng trống hai bên.
boss.height=150                                               # Chiều cao boss (px).
boss.y=130                                                    # Tọa độ mép trên boss khi đứng chiến đấu (px).
boss.sideMargin=16                                            # Khoảng cách boss tới mép vùng ba làn khi đứng ngoài đường (px).
boss.hitsToDefeat=17                                          # Số phát tên lửa trúng để hạ boss; mỗi phát trừ 1/x thanh máu với x là giá trị này, không hiện số máu.
boss.entranceSeconds=1.2                                      # Thời gian boss bay từ biên trên xuống (giây).
boss.healthLoadSeconds=1.8                                    # Thời gian thanh máu boss nạp từ trống tới đầy; chưa tấn công/bắn trong lúc nạp (giây).
boss.moveSeconds=0.55                                         # Thời gian chuyển mượt giữa các làn hoặc ra mép đường (giây), độc lập khoảng nghỉ actionGapSeconds; không dịch chuyển tức thì.
boss.exitSeconds=1.2                                          # Thời gian boss rời màn sau khi hết máu (giây).
boss.finishDelaySeconds=1.2                                   # Chờ đường thông thêm từng này giây sau khi hạ boss mới hoàn thành màn.
boss.color=#7852a8                                            # Màu hình chữ nhật boss khi chưa có ảnh.
sprite.boss=/image/day5/boss.png                              # Ảnh boss toàn thân; thiếu ảnh thì dùng hình chữ nhật.
sprite.bossPortrait=/image/day5/boss-portrait.png             # Ảnh đại diện vuông ở đầu thanh máu boss.

# ============================================================================
# BOSS 02. CHỌN HÀNH ĐỘNG VÀ NHỊP CHỜ
# ============================================================================
boss.startAction=2                                          # Đòn mở đầu trận boss: 1 hoặc 2; mặc định luôn mở đầu bằng đòn 2, kể cả khi chơi lại.
boss.action1Chance=50                                        # Xác suất chọn đòn 1 sau đòn 3 khi còn được lặp chuỗi (%); giới hạn 1 chuỗi thì luôn về đòn 2, sau đòn 2 luôn sang đòn 1.
boss.maxConsecutiveWaveSequences=1                           # Tối đa 1 chuỗi đòn 1 -> 3 trước khi bắt buộc sang đòn 2; nhịp mặc định: 2 -> 1 -> 3 -> 2.
boss.actionGapSeconds=0.1                                    # Nghỉ ngắn sau khi vật cản cũ đi hết (giây); boss bắt đầu chuyển mượt trong khoảng này, đủ nghỉ và tới vị trí là ra đòn.
boss.openingDelaySeconds=0.7                                  # Chờ sau khi boss đứng đúng chỗ ở lượt đầu tiên sau nạp máu (giây); các lượt sau dùng actionGapSeconds.
boss.retrySeconds=0.4                                         # Khoảng chờ thử lại khi không thể sinh đợt/vật phẩm an toàn (giây).

# ============================================================================
# BOSS 03. ĐÒN 1: GỌI 1–2 MÁY BAY VÀ BẮN ĐẠN THEO HAI NHỊP RIÊNG
# ============================================================================
boss.waves.openingVolleyEnabled=true                        # true = mỗi lần vào đòn 1 bắn từng phát theo thứ tự trái, giữa, phải rồi mới gọi máy bay và bắn ngẫu nhiên.
boss.waves.openingVolleyWarningSeconds=0.8                   # Thời gian cảnh báo mỗi phát mở đầu (giây); đủ né vật ném rộng 50 px kể cả khi đang đứng giữa làn.
boss.waves.openingVolleyIntervalSeconds=0.4                  # Khoảng cách tối thiểu giữa hai phát mở đầu (giây), chưa an toàn thì chờ; phát cuối biến mất mới bắt đầu nhịp thường.
boss.waves.durationSeconds=8                                  # Thời gian ra đòn 1, không tính chuyển chỗ và chờ vật cản đi hết (giây).
boss.waves.intervalSeconds=1.4                                # Thời gian chờ tối thiểu giữa hai đợt máy bay (giây), độc lập nhịp bắn đạn; còn giữ khoảng trống gapPixels.
boss.waves.gapPixels=150                                     # Khoảng trống dọc tối thiểu giữa mép cuối đợt máy bay trước và mép đầu đợt sau (px); bị chặn thì đợi lâu hơn.
boss.waves.twoPlaneChance=50                                 # Xác suất chọn hai máy bay trong một đợt (%); phần còn lại một chiếc, 50 = hai khả năng ngang nhau.
boss.waves.speedMultiplier=1.6                                # Tốc độ máy bay đòn 1 bằng tốc độ máy bay thường nhân hệ số này; máy bay đòn 1 không bắn tên lửa.
boss.waves.staggerY=40                                        # Độ lệch dọc của hai máy bay sinh cùng đợt (px); mỗi chiếc ở một làn khác nhau.
boss.waves.throwIntervalSeconds=0.7                          # Khoảng cách giữa các lần xét bắn đạn của boss đòn 1 (giây), không chờ máy bay sinh được.
boss.waves.throwRetrySeconds=0.15                            # Chờ thử lại khi đã chọn bắn nhưng chưa đặt được đạn an toàn (giây); không quay lại xác suất.
boss.waves.throwChance=90                                     # Xác suất bắn ở mỗi nhịp đạn riêng (%); đích ở làn ngẫu nhiên ngang hàng nhân vật.
boss.waves.doubleThrowChance=20                              # Khi đã chọn ném, xác suất ném đồng thời hai làn khác nhau (%); cả hai đều có cảnh báo và được kiểm tra an toàn cùng nhau.
boss.waves.throwActiveSeconds=0.3                             # Thời gian giữ đạn sau khi bay qua đích đã ngắm (giây); đạn gây va chạm suốt đường bay sau cảnh báo.
boss.waves.throwSpeed=800                                   # Tốc độ đạn thật từ tay boss bay qua ô cảnh báo đã khóa (px/giây); bay thẳng, không đuổi người chơi.
boss.waves.handHeightRatio=0.6                              # Vị trí tay tính từ đỉnh boss theo tỷ lệ chiều cao (0..1); dùng chung đạn chéo đòn 1 và 3.
boss.waves.handInsetX=8                                    # Khoảng lùi tay vào trong cạnh boss quay vào đường (px); đổi cạnh khi boss đứng bên phải.
boss.waves.aimLineAlpha=0.22                                # Độ rõ tia ngắm đòn 1 và 3 từ tay boss tới ô dấu chấm than trong lúc cảnh báo (0..1).
boss.waves.aimLineWidth=2                                   # Độ dày tia ngắm (px), chỉ là hình cảnh báo, không gây va chạm.
boss.waves.aimLineColor=#ffcf33                             # Màu tia ngắm mờ trước khi boss bắn thật.

# ============================================================================
# BOSS 04. ĐÒN 2: ĐẢO LÀN, NÉM DỌC LÀN VÀ GỌI CHIM/MÁY BAY
# ============================================================================
boss.lane.durationSeconds=10                                  # Thời gian sinh đòn 2 (giây), phải dài hơn đòn 1; hết giờ vẫn lướt đổi làn và bắn giới hạn recoveryShotLimit viên lúc chờ vật cản cũ đi hết.
boss.lane.healHitsAfterAction=1                               # Boss hồi một lần sau khi đòn 2 và vật cản cũ kết thúc, theo đơn vị hit: 1 = hồi 1/boss.hitsToDefeat thanh máu, không vượt tối đa; 0 = tắt.
boss.lane.changeIntervalSeconds=1                           # Khoảng thời gian đứng tại một làn trước khi đổi sang làn khác (giây).
boss.lane.attackIntervalSeconds=0.55                             # Khoảng cách giữa các lần ném hoặc gọi máy bay (giây); từng lượt vẫn kiểm tra còn đường né.
boss.lane.doubleThrowChance=40                                # Xác suất ném đồng thời hai làn khác nhau khi chọn ném (%).
boss.lane.planeChance=85                                      # Xác suất gọi một máy bay có bắn tên lửa thay cho ném đồ (%).
boss.lane.planeShotIntervalSeconds=0.65                       # Khoảng cách giữa các lần phóng tên lửa thành công của máy bay ở đòn 2 (giây).
boss.lane.planeShotRetrySeconds=0.15                          # Thử lại sau khi chưa bắn được do kín chỗ hoặc không còn lối né (giây).
boss.lane.birdChance=75                                       # Xác suất thêm một chim bay theo cơ chế thường sau một đợt tấn công hợp lệ (%).
boss.lane.throwSpeed=500                                      # Tốc độ vật ném bay thẳng xuống dọc làn (px/giây); không đuổi theo nhân vật.
boss.lane.recoveryShotLimit=3                               # Số viên tối đa boss bắn khi lắc đổi làn chờ kết thúc đòn 2; giới hạn để không tự kéo dài chờ vô hạn, 0 = tắt.
boss.lane.recoveryShotIntervalSeconds=0.8                    # Khoảng cách giữa các viên bắn lúc chờ chuyển đòn 2 (giây); có cảnh báo và khóa đích tại hàng người chơi.
boss.lane.recoveryShotRetrySeconds=0.15                      # Chờ thử lại nếu chưa đặt được viên bắn lúc chờ an toàn (giây); tốc độ dùng lane.throwSpeed, cảnh báo dùng boss.projectile.warningSeconds.
boss.lane.warningSize=72                                    # Kích thước tam giác chấm than cảnh báo vật ném/tên lửa địch trong boss phase (px), vẽ trên nhân vật.
boss.lane.warningOffsetY=18                                 # Khoảng hở từ đáy tam giác tới mép trên hàng nhân vật (px); giữ đúng làn nguy hiểm, không đi theo X người chơi.
boss.lane.warningColor=#ffcf33                              # Màu tam giác và viền đánh dấu đích; dấu đích luôn hiện, tam giác nhấp nháy theo boss.projectile.blinkSeconds.

# ============================================================================
# BOSS 05. VẬT NÉM VÀ CẢNH BÁO
# ============================================================================
boss.projectile.width=50                                      # Chiều rộng vật ném (px).
boss.projectile.height=50                                     # Chiều cao vật ném (px).
boss.projectile.damage=1                                      # Số máu mất khi chạm vật ném của boss, độc lập sát thương vật cản thường.
boss.projectile.warningSeconds=0.65                           # Cảnh báo trước khi vật ném gây va chạm hoặc bắt đầu bay (giây).
boss.projectile.blinkSeconds=0.1                              # Khoảng đổi hiện/ẩn của cảnh báo vật ném (giây).
boss.projectile.warningSize=48                                # Kích thước ô cảnh báo ở đích (px).
boss.projectile.color=#ef9550                                 # Màu vật ném khi chưa có ảnh.
sprite.bossProjectile=/image/day5/boss-projectile.png         # Ảnh vật nhỏ boss ném.
sprite.bossProjectileWarning=/image/day5/boss-projectile-warning.png # Ảnh cảnh báo vật ném: đòn 1/3 tại đích, đòn 2 phía trên nhân vật; code tự nhấp nháy, thiếu ảnh dùng tam giác ở đòn 2.

# ============================================================================
# BOSS 06. PHÍM E, TÊN LỬA NGƯỜI CHƠI VÀ VỤ NỔ
# ============================================================================
boss.playerRocket.width=14                                    # Chiều rộng tên lửa người chơi (px).
boss.playerRocket.height=30                                   # Chiều cao tên lửa người chơi (px).
boss.playerRocket.speed=800                                   # Tốc độ tên lửa bay thẳng lên (px/giây); cần căn làn để trúng boss.
boss.playerRocket.cooldownSeconds=0.9                         # Thời gian hồi giữa hai phát bắn bằng phím E (giây); giữ E để bắn khi hồi xong.
boss.playerRocket.color=#ffe082                               # Màu tên lửa người chơi khi chưa có ảnh.
boss.hintBlinkSeconds=0.3                                     # Khoảng nhấp nháy gợi ý phím E sau khi thanh máu nạp xong (giây), dừng gợi ý khi đã bắn.
boss.hintSize=32                                              # Kích thước ô gợi ý E cạnh nhân vật (px).
boss.hintOffsetX=12                                           # Khoảng cách ô E tới cạnh nhân vật (px).
boss.explosion.seconds=0.35                                   # Thời gian hiệu ứng nổ khi tên lửa trúng boss/vật cản (giây).
boss.explosion.size=52                                        # Kích thước tối đa của hiệu ứng nổ (px).
sprite.playerRocket=/image/day5/player-rocket.png             # Ảnh tên lửa người chơi, mũi hướng lên.
sprite.bossExplosion=/image/day5/explosion.png                # Ảnh hiệu ứng nổ; thiếu ảnh thì vẽ quầng tròn.

# ============================================================================
# BOSS 07. HỒI MÁU VÀ KHIÊN HIẾM, TỐI ĐA HAI CÁI
# ============================================================================
boss.healthPickup.firstDelaySeconds=8                         # Thời gian chờ từ lúc bắt đầu giao chiến boss tới lần thử sinh máu đầu (giây).
boss.healthPickup.minIntervalSeconds=10                       # Khoảng cách tối thiểu giữa các vật phẩm hồi máu trong boss phase (giây).
boss.healthPickup.maxIntervalSeconds=16                       # Khoảng cách tối đa giữa các vật phẩm hồi máu trong boss phase (giây); chọn ngẫu nhiên.
boss.shield.count=4                                        # Số khiên tối đa trong một trận boss, không đảm bảo luôn xuất hiện đủ hai; phần thường không có khiên.
boss.shield.spawnChance=15                                    # Xác suất sinh khiên ở mỗi lượt xét (%), độc lập với hồi máu/vật cản; 0 = không sinh.
boss.shield.firstSpawnSeconds=10                              # Mốc xét sinh khiên đầu tiên tính từ lúc boss bắt đầu ra đòn (giây).
boss.shield.intervalSeconds=12                                # Khoảng cách giữa các lượt xét khiên (giây), kể cả khi trượt xác suất.
boss.shield.width=44                                          # Chiều rộng vật phẩm khiên (px).
boss.shield.height=44                                         # Chiều cao vật phẩm khiên (px).
boss.shield.speed=160                                         # Tốc độ khiên bay từ biên trên xuống (px/giây).
boss.shield.durationSeconds=8                                 # Thời gian bất tử sau khi nhặt khiên (giây), chặn cả va chạm chí mạng và các hiệu ứng vật cản.
boss.shield.contactAlpha=0.45                                 # Độ rõ của nhân vật khi xuyên vật cản: 1 = rõ, 0.45 = mờ còn 45%.
boss.shield.contactFadeSeconds=0.25                           # Thời gian giữ mờ sau lần chạm cuối lúc có khiên (giây).
boss.shield.color=#74edff                                     # Màu vật phẩm và viền khiên bảo vệ khi chưa có ảnh.
sprite.shieldPickup=/image/day5/shield.png                    # Ảnh vật phẩm khiên vuông.

# ============================================================================
# BOSS 08. THANH MÁU, ẢNH ĐẠI DIỆN VÀ THANH HỒI TÊN LỬA
# ============================================================================
boss.hud.x=340                                                # Tọa độ mép trái thanh máu boss (px).
boss.hud.y=96                                                 # Tọa độ mép trên thanh máu boss (px).
boss.hud.width=360                                            # Chiều rộng thanh máu boss (px).
boss.hud.height=18                                            # Chiều cao thanh máu boss (px).
boss.hud.portraitSize=44                                      # Cạnh ô ảnh đại diện boss tại mép trái thanh máu (px).
boss.hud.portraitGap=10                                       # Khoảng cách ô đại diện tới thanh máu (px).
boss.healthBarColor=#e45b74                                   # Màu phần máu còn lại của boss.
boss.cooldown.x=180                                           # Tọa độ mép trái thanh hồi tên lửa (px).
boss.cooldown.y=45                                            # Tọa độ mép trên thanh hồi tên lửa (px).
boss.cooldown.width=170                                       # Chiều rộng thanh hồi tên lửa (px).
boss.cooldown.height=10                                       # Chiều cao thanh hồi tên lửa (px).

# ============================================================================
# BOSS 09. ĐÒN 3 NỐI SAU ĐÒN 1: MÁY BAY VÚT NGƯỢC TỪ DƯỚI LÊN
# ============================================================================
boss.reverse.durationSeconds=6                              # Thời gian danh định của đòn 3 (giây); có thể kéo dài để đủ chuỗi 1 -> 2 -> 3, đạn và các vật cản rời màn trước khi chuyển đòn.
boss.reverse.waveCount=3                                    # Tổng số đợt máy bay bay ngược trong mỗi lượt đòn 3.
boss.reverse.singleWeight=33                                # Trọng số kiểu một máy bay; ba trọng số đều 33 nghĩa là mỗi kiểu có xác suất 1/3 (khoảng 33,33%).
boss.reverse.pairWeight=33                                  # Trọng số kiểu hai máy bay bay cùng lúc ở hai làn khác nhau; 0 = tắt kiểu này.
boss.reverse.sequenceWeight=33                              # Trọng số kiểu ba máy bay lần lượt bay lên làn 1 -> 2 -> 3; 0 = tắt kiểu này.
boss.reverse.sequenceDelaySeconds=0.5                        # Độ trễ giữa cảnh báo/giờ bay của hai chiếc kế tiếp trong chuỗi 1 -> 2 -> 3 (giây); từng chiếc vẫn được cảnh báo đủ warningSeconds.
boss.reverse.shotChance=75                                  # Xác suất boss bắn thêm một viên đạn chéo ở mỗi đợt máy bay đòn 3 (%); xét một lần, đã chọn thì chờ đặt an toàn.
boss.reverse.shotWarningSeconds=0.65                        # Thời gian tia ngắm mờ và ô dấu chấm than trước khi bắn đạn chéo đòn 3 (giây); khóa đích từ lúc cảnh báo.
boss.reverse.shotSpeed=800                                 # Tốc độ đạn chéo bay từ tay boss qua đích ở hàng người chơi (px/giây); không đuổi theo nhân vật.
boss.reverse.shotAfterTargetSeconds=0.3                    # Thời gian giữ đạn chéo sau khi bay qua đích (giây); có va chạm suốt đường bay sau cảnh báo.
boss.reverse.shotRetrySeconds=0.15                          # Chờ thử lại khi đã chọn bắn nhưng đạn chưa có đường né an toàn (giây); không xét lại xác suất 75%.
boss.reverse.warningSeconds=1.25                            # Thời gian cảnh báo nhấp nháy ở làn sắp có máy bay bay ngược (giây), chưa gây va chạm.
boss.reverse.flightSeconds=0.5                              # Thời gian toàn thân máy bay vút từ dưới ra khỏi biên trên (giây); tốc độ tự tính theo kích thước màn/ảnh.
boss.reverse.intervalSeconds=2                             # Khoảng cách giữa lúc bắt đầu cảnh báo hai đợt kế tiếp (giây); không nhỏ hơn thời gian cảnh báo cộng bay.
boss.reverse.spawnMargin=20                                # Khoảng đệm ngoài biên dưới/trên lúc máy bay bắt đầu và kết thúc lượt bay (px).
boss.reverse.blinkSeconds=0.12                              # Khoảng đổi hiện/ẩn của ô cảnh báo máy bay bay ngược (giây).
boss.reverse.warningSize=52                                # Kích thước ô cảnh báo có mũi tên lên và dấu chấm than (px).
boss.reverse.warningY=625                                  # Tọa độ mép trên ô cảnh báo gần biên dưới màn hình (px).
sprite.reversePlaneWarning=/image/day5/reverse-plane-warning.png # Ảnh cảnh báo máy bay từ dưới lên; code tự nhấp nháy, thiếu ảnh dùng ô có mũi tên và dấu chấm than.

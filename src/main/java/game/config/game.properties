# CẤU HÌNH CHUNG
# Ghi chú bắt đầu bằng dấu # có khoảng trắng hai bên; chỉ sửa phần giá trị ở phía trước.
# Đơn vị: px = điểm ảnh; giây; px/giây; hệ số 1 = 100%, 0.65 = 65%.
# Lưu UTF-8; sau khi sửa, chạy run.cmd để build lại.

# ============================================================================
# 01. CHUYỂN MÀN
# ============================================================================
transition.fadeOutSeconds=0.5                    # Thời gian màn hình tối dần sau khi hoàn thành màn (giây).
transition.fadeInSeconds=0.5                     # Thời gian màn hình sáng dần khi vào màn tiếp theo (giây).

# ============================================================================
# 02. VÒNG LẶP CẬP NHẬT VÀ VẼ
# ============================================================================
loop.maxFrameSeconds=0.25                        # Giới hạn thời gian bù cập nhật mỗi nhịp khi máy bị chậm (giây), tránh dồn quá nhiều bước.
loop.timerMillis=16                              # Khoảng gọi bộ cập nhật/vẽ của Swing (mili giây); bước vật lý vẫn cố định 1/60 giây.

# ============================================================================
# 03. THANH TIẾN ĐỘ VÀ ẢNH ĐẠI DIỆN
# ============================================================================
hud.progressX=690                                # Tọa độ mép trái thanh tiến độ trên màn hình (px).
hud.progressY=24                                 # Tọa độ mép trên thanh tiến độ trên màn hình (px).
hud.progressWidth=280                            # Chiều rộng thanh tiến độ (px).
hud.progressHeight=20                            # Chiều cao thanh tiến độ (px).
hud.avatarSize=28                                # Chiều rộng và cao ảnh đại diện ở đầu thanh tiến độ (px).

# ============================================================================
# 04. ĐƯỜNG DẪN HÌNH ẢNH
# ============================================================================
sprite.hudAvatar=/image/common/player/face.png   # Đường dẫn ảnh đại diện trên thanh tiến độ trong tài nguyên; chưa có ảnh thì dùng hình tạm.

# ============================================================================
# 05. LƯU GAME
# ============================================================================
save.directory=saves                             # Thư mục chứa tối đa ba ô lưu; đường dẫn tương đối tính từ nơi chạy game, nên dùng dấu / nếu nhập đường dẫn đầy đủ.

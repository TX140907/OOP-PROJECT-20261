# ==============================================================================
# SANBAKA GAME - BẢNG THÔNG SỐ CÂN BẰNG MÀN ĐÁNH BOSS (MÀN 5 TRỰC THĂNG)
# ==============================================================================
# Bạn có thể chỉnh sửa trực tiếp các thông số dưới đây để cân bằng độ khó của Boss.
# Game sẽ tự động nạp các giá trị này khi chạy (không cần sửa code Java).

# ------------------------------------------------------------------------------
# 1. THÔNG SỐ CƠ BẢN CỦA BOSS
# ------------------------------------------------------------------------------
# Lượng máu tối đa của Boss (tính bằng số phát đạn tên lửa trúng đích để hạ gục)
boss.max_hp=25

# Thời gian màn hình nhấp nháy đỏ báo động trước khi Boss xuất hiện (mili-giây)
boss.warning_flash_ms=1800

# Thời gian Boss gồng nạp đầy cây máu khi vừa xuất hiện (mili-giây)
boss.intro_charge_ms=2500

# Tốc độ lướt đảo vị trí siêu nhanh của Boss theo phương thẳng đứng (pixel/giây)
boss.dash_speed=340.0

# Biên độ di chuyển tối thiểu và tối đa theo trục Y của Boss (pixel)
boss.min_y=110.0
boss.max_y=490.0

# ------------------------------------------------------------------------------
# 2. THÔNG SỐ TÊN LỬA CỦA NGƯỜI CHƠI (PHÍM E)
# ------------------------------------------------------------------------------
# Thời gian hồi chiêu giữa 2 lần bắn tên lửa (giây)
player.missile_cooldown_sec=0.35

# Tốc độ bay của tên lửa người chơi (pixel/giây)
player.missile_speed=680.0

# Sát thương mỗi phát tên lửa gây ra cho Boss (mỗi hit trừ 1 HP)
player.missile_damage=1

# ------------------------------------------------------------------------------
# 3. ĐÒN TẤN CÔNG 1: MÁY BAY YỂM TRỢ + BOSS NGẮM BẮN TỈA
# ------------------------------------------------------------------------------
# Thời gian kéo dài của Đòn 1 trước khi chuyển giao (mili-giây)
boss.attack1_duration_ms=12500

# Khoảng cách giữa các đợt xuất hiện máy bay địch ở Đòn 1 (mili-giây)
boss.attack1_plane_interval_ms=250

# Xác suất máy bay địch bắn 1 viên đạn thẳng về phía trước (0.0 đến 1.0)
boss.attack1_plane_shoot_chance=0.40

# Tốc độ bay của máy bay địch ở Đòn 1 (pixel/giây)
enemy.plane_speed=400.0

# Kích thước chiều dài và chiều sải cánh của máy bay tiêm kích (nhỏ hơn trực thăng một chút)
enemy.plane_width=95.0
enemy.plane_height=55.0

# Tốc độ đạn của máy bay địch bắn thẳng (pixel/giây)
enemy.plane_bullet_speed=420.0

# Nhịp ngắm bắn tỉa của Boss về phía trực thăng người chơi (mili-giây)
boss.attack1_aim_shoot_interval_ms=1900

# Thời gian chiếu tia laser cảnh báo trước khi Boss nhả đạn bắn tỉa (mili-giây)
boss.attack1_laser_warning_ms=450

# Tốc độ bay của viên đạn bắn tỉa từ Boss (pixel/giây)
boss.aim_bullet_speed=460.0

# ------------------------------------------------------------------------------
# 4. PHA CHUYỂN GIAO: BOSS BẮN LOẠN XẠ & BIẾN MẤT
# ------------------------------------------------------------------------------
# Thời gian Boss đảo vị trí và bắn đạn xối xả ngẫu nhiên (mili-giây)
boss.transition_spray_duration_ms=3200

# Tốc độ lùi siêu nhanh của Boss về bên phải màn hình để biến mất (pixel/giây)
boss.retreat_speed=750.0

# ------------------------------------------------------------------------------
# 5. ĐÒN TẤN CÔNG 2: BÃO CHIM TỐC ĐỘ CAO
# ------------------------------------------------------------------------------
# Thời gian hiện cảnh báo chấm than to trước đàn chim (mili-giây)
boss.attack2_warning_ms=1200

# Thời gian kéo dài của đợt bão chim (mili-giây)
boss.attack2_duration_ms=6800

# Khoảng cách xuất hiện giữa các đợt chim bão táp (mili-giây) - Đã rút ngắn để chim dày đặc tràn ngập
boss.attack2_bird_interval_ms=420

# Tốc độ bay của đàn chim trong Đòn 2 (pixel/giây)
boss.attack2_bird_speed=470.0

# ------------------------------------------------------------------------------
# 6. ĐÒN TẤN CÔNG 3: KHÔNG KÍCH RẢI BOM CHÉO
# ------------------------------------------------------------------------------
# Thời gian Boss bắn đạn loạn xạ chào sân khi vừa quay trở lại (mili-giây)
boss.attack3_intro_spray_ms=1400

# Thời gian kéo dài của đợt ném bom Đòn 3 (mili-giây)
boss.attack3_duration_ms=10800

# Khoảng cách giữa các đợt phi đội máy bay bay vút qua hàng trên cùng (mili-giây)
boss.attack3_squadron_interval_ms=150

# Khoảng cách giữa các trái bom thả xuống (mili-giây) - Đã giãn cách để bom thưa hơn
boss.attack3_bomb_interval_ms=280

# Vận tốc rơi của bom theo phương ngang vx (hướng sang trái, pixel/giây)
enemy.bomb_vx=-165.0

# Vận tốc rơi của bom theo phương đứng vy (rơi xuống dưới, pixel/giây)
enemy.bomb_vy=240.0

# Bán kính nổ lan của bom khi bị phá hủy hoặc chạm đất (pixel)
enemy.bomb_blast_radius=90.0

# ------------------------------------------------------------------------------
# 7. ĐỘ BỀN (HP) & KHẢ NĂNG BỊ PHÁ HỦY CỦA CÁC ĐỐI TƯỢNG
# ------------------------------------------------------------------------------
# Số phát đạn tên lửa để phá hủy 1 máy bay địch
enemy.plane_hp=3

# Số phát đạn tên lửa để phá hủy 1 con chim
enemy.bird_hp=1

# Số phát đạn tên lửa để kích nổ 1 trái bom
enemy.bomb_hp=1

# ------------------------------------------------------------------------------
# 8. SÁT THƯƠNG GÂY CHO TRỰC THĂNG NGƯỜI CHƠI (HP TỐI ĐA = 150) - GIẢM 40%
# ------------------------------------------------------------------------------
# Sát thương khi trúng đạn bắn tỉa của Boss (đã giảm 40%)
damage.boss_bullet=13

# Sát thương khi trúng đạn máy bay địch (đã giảm 40%)
damage.plane_bullet=11

# Sát thương khi đâm trực diện vào máy bay địch (đã giảm 40%)
damage.plane_collision=19

# Sát thương khi dính bán kính nổ bom (đã giảm 40%)
damage.bomb_blast=17

# Sát thương khi va chạm đàn chim (đã giảm 40%)
damage.bird_collision=18

